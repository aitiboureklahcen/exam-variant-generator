[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "exam-variant-generator"
version = "0.1.0"
description = "Generate printable exam variants from quiz text files"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["python-docx>=0.8.11"]

[project.scripts]
exam-variant-generator = "exam_variant_generator:main"
